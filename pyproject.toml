[project]
name = "quant-system"
version = "0.1.0"
description = "Grid / Stop-and-Reverse execution system for MCX/NSE via Zerodha Kite Connect"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "kiteconnect>=4.2",
    "asyncpg>=0.29",
    "SQLAlchemy>=2.0",
    "structlog>=24.1",
    "python-dateutil>=2.9",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
]
dashboard = [
    "streamlit>=1.33",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# asyncio_mode = "auto"  # re-enable once pytest-asyncio is installed (Step 7: broker/WebSocket)

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
